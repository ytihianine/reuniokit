objets:
  - name: frontend
    enabled: true
    pod:
      name: reuniokit-frontend
      image:
        repository: ghcr.io/ytihianine/reuniokit/reuniokit
        tag: v3.0.4
        imagePullPolicy: Always
      envFrom:
        - secretRef:
            name: reuniokit-secret
      port: 5050
      securityContext: {}
    service:
      name: reuniokit-svc-frontend
      type: ClusterIP
      port: 7050
      targetPort: http


ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
  hosts:
    - host: reuniokit.lab.incubateur.finances.rie.gouv.fr
      paths:
        - path: /
          pathType: ImplementationSpecific
          backend:
            service:
              name: reuniokit-svc-frontend
              port:
                number: 7050

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: false

nodeSelector:
  nubonyxia.users: "true"
