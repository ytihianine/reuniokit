objets:
  - name: api
    enabled: true
    pod:
      name: reuniokit-api
      image:
        repository: registry.gitlab.com/ytihianine/reuniokit/api
        tag: latest
        imagePullPolicy: Always
      envFrom:
        - secretRef:
            name: reuniokit
      port: 5050
      securityContext: {}
    service:
      name: reuniokit-svc-api
      type: ClusterIP
      port: 7070
      targetPort: http
  - name: frontend
    enabled: true
    pod:
      name: reuniokit-frontend
      image:
        repository: registry.gitlab.com/ytihianine/reuniokit/ui
        tag: latest
        imagePullPolicy: Always
      port: 5050
      securityContext: {}
    service:
      name: reuniokit-svc-frontend
      type: ClusterIP
      port: 7050
      targetPort: http


ingress:
  enabled: true
  className: "nginx"
  annotations: #{}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: reuniokit.lab.sspcloud.fr
      paths:
        - path: /api(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
            service:
            # name fait référence au nom du service définit dans le name du metadata de service-x.yaml / doit être identique au nom défini pour le service
              name: reuniokit-svc-api
              port:
                number: 7070
        - path: /app(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
           service:
              name: reuniokit-svc-frontend
              port:
                number: 7050

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: false

