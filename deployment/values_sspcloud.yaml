objets:
  - name: frontend
    enabled: true
    pod:
      name: reuniokit-frontend
      image:
        repository: ghcr.io/ytihianine/reuniokit/reuniokit
        tag: v3.0.3
        imagePullPolicy: Always
      envFrom:
        - secretRef:
            name: reuniokit-secret
      port: 5050
      securityContext: {}
    service:
      name: reuniokit-svc-frontend
      type: ClusterIP
      port: 7050
      targetPort: http


ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: reuniokit.lab.sspcloud.fr
      paths:
        - path: /
          pathType: ImplementationSpecific
          backend:
            service:
              name: reuniokit-svc-frontend
              port:
                number: 7050


resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: false
