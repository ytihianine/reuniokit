stages:          # List of stages for jobs, and their order of execution
  - build image

build-image:       # This job runs in the build stage, which runs first.
  stage: build image
  image: docker
  services:
    - docker:dind
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - CUSTOM_IMAGE_REGISTRY="$CI_REGISTRY_IMAGE/ui"
    - docker build -t $CUSTOM_IMAGE_REGISTRY -f ui/gitlab_public.Dockerfile ./ui
    - docker push $CUSTOM_IMAGE_REGISTRY
