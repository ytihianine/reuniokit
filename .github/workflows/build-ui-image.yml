name: build-ui-image

on:
  workflow_dispatch:
    inputs:
      npm_proxy_url:
        description: "HTTP proxy URL for npm (empty for none)"
        type: string
        default: ""
  push:
    branches:
      - 'main'
    paths:
      - "ui/**"
      - ".github/workflows/build-ui-image.yml"
  pull_request:
    paths:
      - "ui/**"
  release:
    types: [published]
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/reuniokit

jobs:
  build-ui-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="latest"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push UI image
        uses: docker/build-push-action@v7
        with:
          context: ui
          file: ui/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          build-args: |
            NPM_PROXY_URL=${{ inputs.npm_proxy_url }}
